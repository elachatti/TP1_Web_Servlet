<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP1 - MVC</title>
</head>
<body>
<h2>Application MVC : redirection selon l'age</h2>
<form action="Controller" method="post">
    <table>
        <tr><td>First name :</td><td><input type="text" name="firstName" required></td></tr>
        <tr><td>Last name :</td><td><input type="text" name="lastName" required></td></tr>
        <tr><td>Birth date (mm/dd/yyyy) :</td><td><input type="text" name="birthDay" placeholder="mm/dd/yyyy" required></td></tr>
        <tr><td>Sex :</td><td>
            <input type="radio" name="sex" value="Male" checked> Male
            <input type="radio" name="sex" value="Female"> Female
        </td></tr>
        <tr><td colspan="2"><input type="submit" value="Envoyer"></td></tr>
    </table>
</form>
</body>
</html>
